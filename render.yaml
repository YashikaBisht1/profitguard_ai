services:
  - type: web
    name: profitguard-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: NEO4J_URI
        placeholder: "bolt://..."
      - key: NEO4J_USER
        placeholder: "neo4j"
      - key: NEO4J_PASSWORD
        placeholder: "your-password"
      - key: GROQ_API_KEY
        placeholder: "gsk_..."
      - key: PYTHON_VERSION
        value: "3.10.11"
